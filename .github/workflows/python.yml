name: python

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run with.
        type: string
        default: "3.13"
      working-directory:
        description: Directory of the project, relative to the repository root.
        type: string
        default: "."
      coverage-artifact:
        description: Name of the uploaded coverage artifact.
        type: string
        default: coverage
      coverage:
        description: Upload coverage to Codecov (public repositories only).
        type: boolean
        default: true

permissions: {}

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: error

  codecov:
    name: upload coverage to Codecov
    needs: check
    if: ${{ inputs.coverage && !github.event.repository.private }}
    runs-on: ubuntu-latest
    # an outage on Codecov's side must never fail CI
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.coverage-artifact }}
          path: coverage-report
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage-report/coverage.xml
          flags: python
