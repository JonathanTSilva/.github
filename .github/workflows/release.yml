name: release

on:
  workflow_call:
    inputs:
      release-type:
        description: release-please release type.
        type: string
        default: simple
      artifact-path:
        description: Path (relative to the repository root, at the release tag) of an artifact to attest. Empty skips attestation.
        type: string
        default: ""

permissions: read-all

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: ${{ inputs.release-type }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.release_created && inputs.artifact-path != ''
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.release.outputs.release_created && inputs.artifact-path != ''
        with:
          subject-path: ${{ inputs.artifact-path }}
