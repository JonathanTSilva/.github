name: e2e

# Opt-in. Playwright end-to-end tests with browsers installed and the HTML report uploaded.
# The project uses pnpm (version from "packageManager") and a pnpm-lock.yaml.
# The caller job must grant: contents: read.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run with.
        type: string
        default: "24"
      working-directory:
        description: Directory of the project, relative to the repository root.
        type: string
        default: "."
      browsers:
        description: Browsers to install, space separated (chromium, firefox, webkit).
        type: string
        default: chromium
      command:
        description: Command that runs the tests. Configure a webServer in playwright.config to start the app.
        type: string
        default: pnpm exec playwright test
      report-dir:
        description: Directory the HTML report is written to, relative to working-directory.
        type: string
        default: playwright-report

permissions: {}

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          read -r -a browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"
      - name: Run tests
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/${{ inputs.report-dir }}
          if-no-files-found: warn
          retention-days: 14
