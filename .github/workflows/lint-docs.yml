name: lint-docs

on:
  workflow_call:

permissions: {}

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    name: link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # compare/ links in release-please changelogs point at a tag that exists only
          # after the release; github.com answers runners with transient 503s.
          args: >-
            --no-progress --exclude-path tests/fixtures
            --exclude '^https://github\.com/[^/]+/[^/]+/compare/'
            --max-retries 6 --retry-wait-time 10
            "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
