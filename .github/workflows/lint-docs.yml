name: lint-docs

on:
  workflow_call:

permissions: {}

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    name: link check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # compare/ links in release-please changelogs point at a tag that exists only
          # after the release. github.com's HTML pages answer runners with 503s, so
          # blob links are checked as raw files (same existence check) and every host
          # is throttled. 429 and 503 are rate limits, not missing pages (404/410 still
          # fail); 999 is LinkedIn's answer to bots. A CLI --accept replaces any repo's
          # lychee.toml accept list, so those codes live here.
          args: >-
            --no-progress --exclude-path tests/fixtures
            --exclude '^https://github\.com/[^/]+/[^/]+/compare/'
            --remap '^https://github\.com/([^/]+)/([^/]+)/blob/([^#?]+).* https://raw.githubusercontent.com/$1/$2/$3'
            --host-concurrency 2 --host-request-interval 500ms
            --accept '100..=103,200..=299,429,503,999'
            --max-retries 6 --retry-wait-time 10
            "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
