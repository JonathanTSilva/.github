name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  python:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python.yml
    with:
      working-directory: tests/fixtures/python-min

  node:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/node.yml
    with:
      working-directory: tests/fixtures/node-min

  shell:
    permissions:
      contents: read
    uses: ./.github/workflows/shell.yml
    with:
      working-directory: tests/fixtures/shell-min

  go:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/go.yml
    with:
      working-directory: tests/fixtures/go-min

  rust:
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: tests/fixtures/rust-min

  c-cpp:
    permissions:
      contents: read
    uses: ./.github/workflows/c-cpp.yml
    with:
      working-directory: tests/fixtures/c-min

  latex:
    permissions:
      contents: read
    uses: ./.github/workflows/latex.yml
    with:
      working-directory: tests/fixtures/latex-min

  branch-name:
    name: branch-name tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes bats@1.13.0 tests/branch-name.bats

  branch-name-action:
    name: branch-name action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/branch-name
