name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  python:
    permissions:
      contents: read
    uses: ./.github/workflows/python.yml
    with:
      working-directory: tests/fixtures/python-min

  node:
    permissions:
      contents: read
    uses: ./.github/workflows/node.yml
    with:
      working-directory: tests/fixtures/node-min
      coverage: true

  shell:
    permissions:
      contents: read
    uses: ./.github/workflows/shell.yml
    with:
      working-directory: tests/fixtures/shell-min

  go:
    permissions:
      contents: read
    uses: ./.github/workflows/go.yml
    with:
      working-directory: tests/fixtures/go-min

  rust:
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml
    with:
      working-directory: tests/fixtures/rust-min

  c-cpp:
    permissions:
      contents: read
    uses: ./.github/workflows/c-cpp.yml
    with:
      working-directory: tests/fixtures/c-min

  latex:
    permissions:
      contents: read
    uses: ./.github/workflows/latex.yml
    with:
      working-directory: tests/fixtures/latex-min

  # Codecov upload through the opt-in coverage workflow, one call per language
  coverage-python:
    needs: python
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
    with:
      artifact: coverage
      flags: python

  coverage-node:
    needs: node
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
    with:
      artifact: node-coverage
      flags: node

  coverage-go:
    needs: go
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
    with:
      artifact: go-coverage
      flags: go

  # SONAR_TOKEN is not set on this repo, so the scan is skipped with a notice
  sonar:
    permissions:
      contents: read
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      working-directory: tests/fixtures/e2e-min

  lighthouse:
    permissions:
      contents: read
    uses: ./.github/workflows/lighthouse.yml
    with:
      working-directory: tests/fixtures/lighthouse-min
      static-dist-dir: site
      budget-path: budget.json

  load:
    permissions:
      contents: read
    uses: ./.github/workflows/load.yml
    with:
      working-directory: tests/fixtures/load-min
      script: script.js
      server-command: python3 -m http.server 3000 --bind 127.0.0.1 --directory site
      server-url: http://127.0.0.1:3000
      duration: 5s
      vus: 2

  # this repo has no gh-pages branch, so the history is skipped with a warning
  bench:
    permissions:
      contents: write
    uses: ./.github/workflows/bench.yml
    with:
      working-directory: tests/fixtures/bench-min
      command: ./bench.sh

  allure-results:
    name: allure results fixture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: tests/fixtures/allure-min/allure-results
          if-no-files-found: error
          retention-days: 1

  reports:
    needs: allure-results
    permissions:
      contents: write
    uses: ./.github/workflows/reports.yml

  branch-name:
    name: branch-name tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes bats@1.13.0 tests/branch-name.bats

  branch-name-action:
    name: branch-name action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/branch-name
