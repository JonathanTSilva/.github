name: reports

# Opt-in. Builds an Allure report from a results artifact and, on pushes to the default
# branch, publishes it to the gh-pages branch under /reports/ (served by GitHub Pages).
# Call it after the job that uploads the Allure results, with `needs:`.
# A repo without a gh-pages branch, or with Pages disabled, still gets the report as an
# artifact. The publish step is optional and warns clearly, it never breaks CI.
# The caller job must grant: contents: write.

on:
  workflow_call:
    inputs:
      results-artifact:
        description: Name of the artifact that holds the Allure results.
        type: string
        default: allure-results
      node-version:
        description: Node.js version used to run the Allure CLI.
        type: string
        default: "24"

permissions: {}

jobs:
  report:
    name: Allure report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Allure 3 CLI, pinned
      ALLURE_VERSION: 3.33.0
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.results-artifact }}
          path: allure-results
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Generate the report
        run: npx --yes "allure@${ALLURE_VERSION}" generate allure-results --output allure-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 14
      - name: Look for the gh-pages branch
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/branches/gh-pages" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Report not published::The repository has no gh-pages branch. The report is in the allure-report artifact. Create the branch and enable Pages (deploy from gh-pages) to publish it."
          fi
      - name: Publish to gh-pages under /reports/
        if: ${{ steps.pages.outputs.exists == 'true' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
        # publishing is optional, a failure here must never break CI
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          trap 'echo "::warning title=Report not published::Could not push gh-pages. Check that the caller grants contents: write and the branch is not protected."' ERR
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$RUNNER_TEMP/gh-pages"
          rm -rf "$RUNNER_TEMP/gh-pages/reports"
          mkdir "$RUNNER_TEMP/gh-pages/reports"
          cp -a allure-report/. "$RUNNER_TEMP/gh-pages/reports/"
          cd "$RUNNER_TEMP/gh-pages"
          touch .nojekyll
          git add --all
          if git diff --cached --quiet; then
            echo "The report is unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "docs: publish Allure report for ${SHA}"
          git push origin gh-pages
          echo "Published to https://${OWNER,,}.github.io/${NAME}/reports/ once Pages deploys from gh-pages." | tee -a "$GITHUB_STEP_SUMMARY"
