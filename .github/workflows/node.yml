name: node

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run with.
        type: string
        default: "24"
      working-directory:
        description: Directory of the project, relative to the repository root.
        type: string
        default: "."
      coverage:
        description: Run the project's "coverage" script and upload coverage/lcov.info as the node-coverage artifact.
        type: boolean
        default: false

permissions: {}

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      # the "coverage" script must write coverage/lcov.info
      - name: Coverage
        id: coverage
        if: ${{ inputs.coverage }}
        run: |
          pnpm run --if-present coverage
          if [ -f coverage/lcov.info ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No coverage/lcov.info produced, skipping the coverage artifact"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.coverage.outputs.found == 'true' }}
        with:
          name: node-coverage
          path: ${{ inputs.working-directory }}/coverage/lcov.info
          if-no-files-found: error
