name: coverage

# Opt-in. Call it after python, node or go with `needs:` so the artifact exists.
# The caller job must grant: contents: read, actions: read, id-token: write.

on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the coverage artifact to download (python coverage by default, node-coverage, go-coverage).
        type: string
        required: true
      flags:
        description: Codecov flags for this upload, such as python, node or go.
        type: string
        default: ""

permissions: {}

jobs:
  codecov:
    name: upload coverage to Codecov
    # public repositories only
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # an outage on Codecov's side must never fail CI
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: coverage-report
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          directory: coverage-report
          flags: ${{ inputs.flags }}
