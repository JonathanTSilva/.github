name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  data:
    name: validate data and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate data files against their schemas
        run: |
          for name in standard labels inventory; do
            uvx check-jsonschema==0.39.0 --schemafile "schemas/${name}.schema.json" "${name}.yml"
          done
      - name: Validate issue forms
        shell: bash
        run: |
          shopt -s nullglob
          forms=()
          for f in ISSUE_TEMPLATE/*.yml; do
            [ "$(basename "$f")" = config.yml ] || forms+=("$f")
          done
          if [ "${#forms[@]}" -eq 0 ]; then
            echo "No issue forms found, skipping"
          else
            uvx check-jsonschema==0.39.0 --builtin-schema vendor.github-issue-forms "${forms[@]}"
          fi
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: Audit workflows
        run: uvx zizmor==1.32.0 .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  markdown:
    name: lint markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
