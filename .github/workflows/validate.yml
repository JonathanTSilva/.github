name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

jobs:
  data:
    name: validate data and workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate data files against their schemas
        run: |
          for name in standard labels inventory; do
            uvx check-jsonschema==0.39.0 --schemafile "schemas/${name}.schema.json" "${name}.yml"
          done
      - name: Validate issue forms
        shell: bash
        run: |
          shopt -s nullglob
          forms=()
          for f in ISSUE_TEMPLATE/*.yml; do
            [ "$(basename "$f")" = config.yml ] || forms+=("$f")
          done
          if [ "${#forms[@]}" -eq 0 ]; then
            echo "No issue forms found, skipping"
          else
            uvx check-jsonschema==0.39.0 --builtin-schema vendor.github-issue-forms "${forms[@]}"
          fi
      - name: Validate composite actions
        shell: bash
        run: |
          shopt -s nullglob globstar
          actions=(actions/**/action.yml)
          if [ "${#actions[@]}" -eq 0 ]; then
            echo "No composite actions found, skipping"
          else
            uvx check-jsonschema==0.39.0 --builtin-schema vendor.github-actions "${actions[@]}"
          fi
      - name: Check that existing workflows request no new permissions
        # GitHub checks a called workflow's permissions statically, so a widened request makes
        # every existing caller fail at startup. Compare with the handbook's "v1.0 caller grants".
        shell: bash
        run: |
          uv run --no-project --with pyyaml==6.0.2 python - <<'PY'
          import pathlib
          import re
          import sys

          import yaml

          CHECKED = ["python", "node", "shell", "lint-docs", "pr-hygiene"]
          RANK = {"none": 0, "read": 1, "write": 2}

          text = pathlib.Path("handbook/repo-anatomy.md").read_text()
          section = re.search(r"^#+ v1\.0 caller grants\s*$(.*?)(?=^#+ |\Z)", text, re.M | re.S)
          if not section:
              sys.exit("::error::handbook/repo-anatomy.md has no 'v1.0 caller grants' section")

          grants = {}
          for line in section.group(1).splitlines():
              if not line.startswith("|"):
                  continue
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              names = re.findall(r"`([^`]+)`", cells[0])
              perms = re.findall(r"`([a-z-]+): (read|write)`", cells[1]) if len(cells) > 1 else []
              for name in names:
                  if perms:
                      grants[name] = dict(perms)

          errors = []
          for name in CHECKED:
              if name not in grants:
                  errors.append(f"{name}: not listed in the v1.0 caller grants table")
                  continue
              doc = yaml.safe_load(pathlib.Path(f".github/workflows/{name}.yml").read_text())
              blocks = {"workflow": doc.get("permissions")}
              blocks.update({f"job {job}": body.get("permissions") for job, body in doc["jobs"].items()})
              for where, perms in blocks.items():
                  if perms is None:
                      continue
                  if isinstance(perms, str):
                      errors.append(f"{name}.yml {where}: '{perms}' is wider than the v1.0 grants")
                      continue
                  for scope, level in perms.items():
                      if RANK[level] > RANK[grants[name].get(scope, "none")]:
                          errors.append(f"{name}.yml {where}: requests {scope}: {level}, v1.0 callers grant {grants[name].get(scope, 'nothing')}")

          for error in errors:
              print(f"::error::{error}")
          if errors:
              sys.exit(1)
          print(f"{', '.join(CHECKED)} request nothing beyond the v1.0 caller grants")
          PY
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: Audit workflows
        run: uvx zizmor==1.32.0 .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  shell:
    name: lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: shellcheck and shfmt
        shell: bash
        run: |
          shopt -s nullglob globstar
          scripts=(actions/**/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No scripts found, skipping"
          else
            uvx --from shellcheck-py==0.11.0.1 shellcheck "${scripts[@]}"
            uvx --from shfmt-py==4.2.0 shfmt -d "${scripts[@]}"
          fi

  markdown:
    name: lint markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
